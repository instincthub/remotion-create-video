
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  .outro-wrap {
    width: 100%;
    aspect-ratio: 9/16;
    max-width: 360px;
    margin: 0 auto;
    background: #0F1A17;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    font-family: 'DM Sans', sans-serif;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(26,122,110,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,122,110,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  .teal-glow {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(26,122,110,0.18) 0%, transparent 70%);
    bottom: -80px;
    left: 50%;
    transform: translateX(-50%);
    animation: pulseGlow 3s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 32px 28px;
    gap: 0;
  }

  .divider-top {
    width: 48px;
    height: 2px;
    background: #1A7A6E;
    border-radius: 2px;
    animation: expandLine 0.6s ease-out 0.2s both;
    margin-bottom: 28px;
  }

  @keyframes expandLine {
    from { width: 0; opacity: 0; }
    to { width: 48px; opacity: 1; }
  }

  .logo-mark {
    margin-bottom: 20px;
    animation: fadeUp 0.6s ease-out 0.4s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .wordmark {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.3px;
    margin-bottom: 8px;
    animation: fadeUp 0.6s ease-out 0.55s both;
  }

  .wordmark .ai { color: #FFFFFF; }
  .wordmark .playbook { color: #1A7A6E; }

  .tagline {
    font-family: 'DM Mono', monospace;
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    margin-bottom: 40px;
    animation: fadeUp 0.6s ease-out 0.7s both;
  }

  .cta-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 36px;
    animation: fadeUp 0.6s ease-out 0.85s both;
  }

  .cta-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
  }

  .handle-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  .handle {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(26,122,110,0.12);
    border: 0.5px solid rgba(26,122,110,0.35);
    border-radius: 8px;
    padding: 10px 18px;
    width: 100%;
    justify-content: center;
    animation: shimmer 2.5s ease-in-out infinite;
  }

  .handle:nth-child(2) { animation-delay: 0.3s; }

  @keyframes shimmer {
    0%, 100% { border-color: rgba(26,122,110,0.35); }
    50% { border-color: rgba(26,122,110,0.65); }
  }

  .platform-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #1A7A6E;
    flex-shrink: 0;
  }

  .handle-text {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 13px;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.01em;
  }

  .platform-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-left: auto;
  }

  .divider-bottom {
    width: 32px;
    height: 1px;
    background: rgba(26,122,110,0.4);
    border-radius: 1px;
    margin-bottom: 20px;
    animation: expandLine 0.6s ease-out 1s both;
  }

  .subscribe-cta {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: #1A7A6E;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    animation: fadeUp 0.6s ease-out 1.1s both;
  }

  .instincthub-tag {
    position: absolute;
    bottom: 18px;
    right: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 8.5px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    animation: fadeUp 0.6s ease-out 1.3s both;
  }

  .scan-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(26,122,110,0.4), transparent);
    animation: scanDown 4s linear infinite;
    pointer-events: none;
  }

  @keyframes scanDown {
    0% { top: 0%; opacity: 0; }
    5% { opacity: 1; }
    95% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  .format-note {
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    margin-top: 12px;
    letter-spacing: 0.06em;
  }
</style>
